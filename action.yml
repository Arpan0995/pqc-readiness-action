name: "PQC Readiness Audit"
description: "Estimate post-quantum migration effort for Java code and upload SARIF findings to GitHub code scanning."
author: "Arpan Sharma"

branding:
  icon: "shield"
  color: "purple"

inputs:
  path:
    description: "Source root to scan, relative to the workspace. Scan the repository root so code-scanning alerts resolve to files."
    required: false
    default: "."
  name:
    description: "Codebase label used in the reports. Defaults to the repository name."
    required: false
    default: ""
  output-dir:
    description: "Directory the JSON, Markdown, and SARIF reports are written to."
    required: false
    default: "audit-out"
  auditor-version:
    description: "pqc-readiness-auditor version to download from Maven Central. 1.1.0 is the earliest version with SARIF output."
    required: false
    default: "1.3.0"
  upload-sarif:
    description: "Upload the SARIF report to GitHub code scanning. Requires the security-events: write permission."
    required: false
    default: "true"

outputs:
  findings:
    description: "Total number of findings across all modules."
    value: ${{ steps.audit.outputs.findings }}
  sarif-file:
    description: "Workspace-relative path of the SARIF report."
    value: ${{ steps.audit.outputs.sarif-file }}
  report-dir:
    description: "Workspace-relative path of the report directory."
    value: ${{ steps.audit.outputs.report-dir }}

runs:
  using: "composite"
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: "temurin"
        java-version: "21"

    - name: Run PQC readiness audit
      id: audit
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_NAME: ${{ inputs.name }}
        INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
        INPUT_VERSION: ${{ inputs.auditor-version }}
      run: |
        set -euo pipefail

        jar="$RUNNER_TEMP/pqc-readiness-auditor-$INPUT_VERSION-all.jar"
        url="https://repo1.maven.org/maven2/io/github/arpan0995/pqc-readiness-auditor/$INPUT_VERSION/pqc-readiness-auditor-$INPUT_VERSION-all.jar"

        echo "Downloading pqc-readiness-auditor $INPUT_VERSION from Maven Central"
        curl -fsSL --retry 3 -o "$jar" "$url"
        curl -fsSL --retry 3 -o "$jar.sha256" "$url.sha256"
        if command -v sha256sum >/dev/null 2>&1; then
          echo "$(cat "$jar.sha256")  $jar" | sha256sum -c -
        else
          echo "$(cat "$jar.sha256")  $jar" | shasum -a 256 -c -
        fi

        label="$INPUT_NAME"
        if [ -z "$label" ]; then
          label="$(basename "$GITHUB_REPOSITORY")"
        fi

        java -jar "$jar" "$INPUT_PATH" --out "$INPUT_OUTPUT_DIR" --name "$label"

        findings="$(jq -r '.totalFindings' "$INPUT_OUTPUT_DIR/readiness-report.json")"
        {
          echo "findings=$findings"
          echo "sarif-file=$INPUT_OUTPUT_DIR/readiness-report.sarif"
          echo "report-dir=$INPUT_OUTPUT_DIR"
        } >> "$GITHUB_OUTPUT"

        {
          head -c 65536 "$INPUT_OUTPUT_DIR/readiness-report.md"
          echo
          echo "*Full reports in \`$INPUT_OUTPUT_DIR/\` (JSON, Markdown, SARIF).*"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload SARIF to code scanning
      if: inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.audit.outputs.sarif-file }}
